[[mods]]
modId="perigee"
version="${mod_version}"
displayName="Perigee"
logoFile="perigee_logo.png"
authors="Oculifelis"
description='''
Tide Basins condense brine of the current moon phase under the night sky. Brine poured over glass on a Tidal Stand makes lenses for a Phase Medallion, each with the power of its tide. A rare Perigee moon and the special moons of other mods give brines of their own.
'''

